name: Validate source artifact
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-validation.lock
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgmp-dev
      - name: Verify release contents
        run: python tools/check_integrity.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements-validation.lock
      - name: Build native backend from source
        run: python tools/build_native.py
      - name: Run protocol and backend tests
        run: python -m unittest discover -s tests -v
      - name: Run evaluation tests
        run: python -m unittest discover -s supplement/tests -v
      - name: Run a small experiment and resume it
        run: |
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --output results/ci-smoke
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --output results/ci-smoke
      - name: Check registration reference, cached mode and resume
        run: |
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --registration-only --y-reference --grid 2:1 3:4 --output results/ci-registration
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --registration-only --y-reference --grid 2:1 3:4 --output results/ci-registration
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --registration-only --source-validation cached --grid 2:1 --output results/ci-cached
      - name: Check update L/u scans, offline replay and resume
        run: |
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --grid 3:4 --update-grid 3:4 3:8 4:4 --history-grid 3:4 --history-lengths 1 3 --checkpoint-events 1 --history-replays 2 --output results/ci-dynamic
          REGABE_PYTHON=python bash run_experiments.sh --profile smoke --grid 3:4 --update-grid 3:4 3:8 4:4 --history-grid 3:4 --history-lengths 1 3 --checkpoint-events 1 --history-replays 2 --output results/ci-dynamic
